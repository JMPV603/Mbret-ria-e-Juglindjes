<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sitio Privado</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        h2 { color: #333; margin-bottom: 20px; }
        input[type="password"] {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            margin-top: 10px;
        }
        button:hover { background-color: #0056b3; }
        .error { color: #dc3545; font-size: 14px; margin-top: 10px; display: none; }
        .hidden-content { display: none; }
        .welcome-card { background-color: #e2f0d9; border: 1px solid #b5d99c; padding: 20px; border-radius: 8px; }
    </style>
</head>
<body>

<div class="container" id="loginCard">
    <h2>Ingresa la Contraseña</h2>
    <input type="password" id="passwordInput" placeholder="Contraseña...">
    <button onclick="verificarContraseña()">Ingresar</button>
    <p class="error" id="errorMessage">Contraseña incorrecta. Intenta de nuevo.</p>
</div>

<div class="container hidden-content" id="contentCard">
    <div class="welcome-card">
        <h2>¡Acceso Concedido!</h2>
        <p>Has ingresado correctamente con la contraseña <strong>BmmB</strong>.</p>
        <p>Este es el contenido privado de tu página web de internet.</p>
    </div>
</div>

<script>
    function verificarContraseña() {
        const input = document.getElementById('passwordInput').value;
        const error = document.getElementById('errorMessage');
        const loginCard = document.getElementById('loginCard');
        const contentCard = document.getElementById('contentCard');

        // Aquí se define tu contraseña secreta
        if (input === 'BmmB') {
            error.style.display = 'none';
            loginCard.style.display = 'none';
            contentCard.style.display = 'block';
        } else {
            error.style.display = 'block';
        }
    }

    // Permitir presionar 'Enter' para ingresar
    document.getElementById('passwordInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            verificarContraseña();
        }
    });
</script>

</body>
</html>
